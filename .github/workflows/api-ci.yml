name: API CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test

  ci-gate:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Gate
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI gate failed" && exit 1
          fi
